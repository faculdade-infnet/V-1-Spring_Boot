jwt.private.key=classpath:app.key
jwt.public.key=classpath:app.pub

# Postgres
# localhost:8080/database_at
spring.datasource.url=jdbc:postgresql://localhost:5432/database_at
spring.datasource.username=admin
spring.datasource.password=admin

api.security.token.secret=${JWT_SECRET:my-secret-key}

# cria/atualiza tabelas automaticamente a partir das suas entidades JPA.
spring.jpa.hibernate.ddl-auto=update
# mostra as queries SQL no console (útil para depuração).
spring.jpa.show-sql=true
# garante que o Hibernate use sintaxe compatível com PostgreSQL.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect